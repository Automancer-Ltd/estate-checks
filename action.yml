name: 'Estate Checks'
description: 'Enforce bounds on external network and subprocess calls across the Automancer estate'
inputs:
  rules-path:
    description: 'Custom path to Semgrep rules file (defaults to bundled rules/unbounded-calls.yml)'
    required: false
    default: ''
  semgrep-version:
    description: 'Pinned Semgrep version'
    required: false
    default: '1.178.0'
  baseline-commit:
    description: 'Baseline git commit SHA to diff against on pull requests (defaults to PR base SHA)'
    required: false
    default: ''
  fail-on-findings:
    description: 'Warnings by default. "true" makes findings, and a check that could not run, fail the job; "false" or "auto" (legacy) only warn.'
    required: false
    default: 'false'
  exclude-paths:
    description: 'Comma- or newline-separated paths or glob patterns to exclude from scanning (e.g. browser UI directories, generated assets)'
    required: false
    default: ''
  exclude-test-paths:
    description: 'Comma- or newline-separated test paths or glob patterns to exclude from scanning (set to empty to disable default test exclusions)'
    required: false
    default: '*.test.*, *_test.py, tests/**, __tests__/**'
outputs:
  findings-count:
    description: 'Total number of reported findings'
    value: ${{ steps.scan.outputs.findings_count }}

runs:
  using: 'composite'
  steps:
    - name: Set up Semgrep
      id: setup-semgrep
      shell: bash
      env:
        SEMGREP_VERSION: ${{ inputs.semgrep-version }}
      run: |
        set -euo pipefail
        if command -v semgrep >/dev/null 2>&1 && [ "$(semgrep --version 2>/dev/null)" = "$SEMGREP_VERSION" ]; then
          echo "Semgrep $SEMGREP_VERSION is already installed."
          exit 0
        fi

        echo "Installing Semgrep $SEMGREP_VERSION..."
        if command -v uv >/dev/null 2>&1; then
          uv tool install "semgrep==$SEMGREP_VERSION"
        elif command -v pipx >/dev/null 2>&1; then
          pipx install "semgrep==$SEMGREP_VERSION"
        elif command -v pip3 >/dev/null 2>&1; then
          pip3 install --break-system-packages "semgrep==$SEMGREP_VERSION"
        else
          python3 -m pip install --break-system-packages "semgrep==$SEMGREP_VERSION"
        fi

        if [ -d "$HOME/.local/bin" ]; then
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
        fi

        semgrep --version

    - name: Run Unbounded Calls Check
      id: scan
      shell: bash
      env:
        INPUT_RULES_PATH: ${{ inputs.rules-path }}
        INPUT_BASELINE_COMMIT: ${{ inputs.baseline-commit }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        INPUT_EXCLUDE_TEST_PATHS: ${{ inputs.exclude-test-paths }}
        ACTION_PATH: ${{ github.action_path }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PATH: ${{ github.event_path }}
      run: |
        set -euo pipefail

        # Waseem, 2026-09-27: this check warns, it does not block. A finding or a
        # check that could not run is a loud warning (annotation + job summary),
        # never a silent pass and never a failed PR, unless a repo opts in with
        # fail-on-findings: 'true'.
        STRICT="false"
        [ "${INPUT_FAIL_ON_FINDINGS:-false}" = "true" ] && STRICT="true"
        could_not_run() {
          echo "::warning title=Estate check could not run::$1"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '## Estate Checks: Unbounded Outside Calls\n\n:warning: **The check could not run:** %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "${RESULTS_FILE:-}"
          [ "$STRICT" = "true" ] && exit 1
          exit 0
        }

        # Resolve rules path
        RULES_PATH="${INPUT_RULES_PATH:-$ACTION_PATH/rules/unbounded-calls.yml}"
        if [ ! -f "$RULES_PATH" ]; then
          could_not_run "Rules file not found at $RULES_PATH"
        fi

        # Determine pull request status and baseline commit
        IS_PR="false"
        BASE_COMMIT="${INPUT_BASELINE_COMMIT:-}"

        if [ "$EVENT_NAME" = "pull_request" ]; then
          IS_PR="true"
          if [ -z "$BASE_COMMIT" ] && [ -n "${EVENT_PATH:-}" ] && [ -f "$EVENT_PATH" ]; then
            BASE_COMMIT="$(python3 -c 'import json, sys; d=json.load(open(sys.argv[1])); print(d.get("pull_request", {}).get("base", {}).get("sha", ""))' "$EVENT_PATH" 2>/dev/null || true)"
          fi
        fi

        # Build scan arguments
        SEMGREP_ARGS=(scan --config "$RULES_PATH")

        if [ "$IS_PR" = "true" ]; then
          if [ -z "$BASE_COMMIT" ]; then
            could_not_run "Pull request scanning requires a baseline commit SHA. To enable differential scanning, checkout needs fetch-depth: 0 (configure 'actions/checkout' with 'fetch-depth: 0') and pass baseline-commit: \${{ github.event.pull_request.base.sha }}."
          fi

          if ! git rev-parse --verify "$BASE_COMMIT^{commit}" >/dev/null 2>&1; then
            echo "Fetching baseline commit $BASE_COMMIT..."
            git fetch --no-tags --depth=1 origin "$BASE_COMMIT" 2>/dev/null || git fetch --unshallow 2>/dev/null || true
          fi

          if ! git rev-parse --verify "$BASE_COMMIT^{commit}" >/dev/null 2>&1; then
            could_not_run "Baseline commit $BASE_COMMIT could not be resolved in git history. To enable differential scanning on pull requests, checkout needs fetch-depth: 0 (configure 'actions/checkout' with 'fetch-depth: 0')."
          fi

          echo "Running differential scan against baseline commit: $BASE_COMMIT"
          SEMGREP_ARGS+=(--baseline-commit "$BASE_COMMIT")
        else
          if [ -n "$BASE_COMMIT" ]; then
            if git rev-parse --verify "$BASE_COMMIT^{commit}" >/dev/null 2>&1; then
              echo "Running differential scan against baseline commit: $BASE_COMMIT"
              SEMGREP_ARGS+=(--baseline-commit "$BASE_COMMIT")
            else
              echo "::warning::Baseline commit $BASE_COMMIT could not be resolved in git history; scanning whole working tree."
              BASE_COMMIT=""
            fi
          else
            echo "Running full repository scan (no baseline commit specified)."
          fi
        fi

        # Parse and append test exclusions
        if [ -n "${INPUT_EXCLUDE_TEST_PATHS:-}" ]; then
          while IFS= read -r pattern; do
            pattern="$(echo "$pattern" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$pattern" ]; then
              SEMGREP_ARGS+=(--exclude "$pattern")
            fi
          done < <(printf '%s\n' "$INPUT_EXCLUDE_TEST_PATHS" | tr ',' '\n')
        fi

        # Parse and append custom path exclusions
        if [ -n "${INPUT_EXCLUDE_PATHS:-}" ]; then
          while IFS= read -r pattern; do
            pattern="$(echo "$pattern" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$pattern" ]; then
              SEMGREP_ARGS+=(--exclude "$pattern")
            fi
          done < <(printf '%s\n' "$INPUT_EXCLUDE_PATHS" | tr ',' '\n')
        fi

        RESULTS_FILE="${RUNNER_TEMP:-/tmp}/estate-checks-results-$$.json"
        SEMGREP_ARGS+=(--json-output="$RESULTS_FILE" .)

        # Run semgrep
        SCAN_EXIT=0
        semgrep "${SEMGREP_ARGS[@]}" || SCAN_EXIT=$?

        if [ "$SCAN_EXIT" -ne 0 ]; then
          could_not_run "Semgrep failed with exit code $SCAN_EXIT"
        fi

        if [ ! -f "$RESULTS_FILE" ]; then
          could_not_run "Semgrep results file was not created: $RESULTS_FILE"
        fi

        # Validate scan, deduplicate findings by call site, and generate summary
        ESTATE_CHECKS_EXCLUDE_PATHS="${INPUT_EXCLUDE_PATHS:-}" \
        ESTATE_CHECKS_EXCLUDES="${INPUT_EXCLUDE_TEST_PATHS:-},${INPUT_EXCLUDE_PATHS:-}" \
          python3 "$ACTION_PATH/scripts/generate-summary.py" "$RESULTS_FILE" "$IS_PR" "$BASE_COMMIT" "$PWD" \
          || could_not_run "the scan result failed validation (see the warning above)"

        FINDINGS_COUNT="$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1])).get("results", [])))' "$RESULTS_FILE" 2>/dev/null || echo "0")"

        echo "Total findings: $FINDINGS_COUNT"
        rm -f "$RESULTS_FILE"

        if [ "$FINDINGS_COUNT" -gt 0 ]; then
          if [ "$STRICT" = "true" ]; then
            echo "::error::Estate check failed: $FINDINGS_COUNT unbounded outside call(s) detected."
            exit 1
          fi
          echo "::warning title=Unbounded outside calls::$FINDINGS_COUNT call(s) without a time limit — see the annotations and job summary. Warning only; this does not block the PR."
        fi

        echo "Estate check completed successfully."
        exit 0
