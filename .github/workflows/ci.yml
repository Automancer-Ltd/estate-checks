name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install check tools
        run: |
          set -euo pipefail
          uv sync --frozen
          uv tool install semgrep==1.178.0
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location --max-time 30 \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        timeout-minutes: 3
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          # Bounded per attempt, digest-pinned and retried, so a stalled or truncated transfer
          # retries here instead of reddening Check (19 Oct 2026, gdp-maia run 39339817582
          # stalled at 3.7 MB of 8.2 MB, and the scan then read a truncated archive).
          scripts/fetch-gitleaks.sh "$GITLEAKS_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan commit for secrets
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=HEAD
      - name: Lint, typecheck and script tests
        run: scripts/check scripts/test-validation.py scripts/test-workflow-standards.py scripts/test-install-timeouts.py tier/test_classify.py waseem-guard/test_guard.py

      - name: Bounded Semgrep install test
        run: scripts/test-install-semgrep.sh

      - name: Semgrep rule tests and syntax
        run: |
          set -euo pipefail
          semgrep --test --legacy rules/
          semgrep --validate --config rules/unbounded-calls.yml

      - name: Verify real action journeys
        run: uv tool run --python 3.12 --from semgrep==1.178.0 --with PyYAML python scripts/verify-estate-checks.py --evidence .audit/ci-proof

      - name: Retain action proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: action-proof
          path: .audit/ci-proof
          include-hidden-files: true
          retention-days: 14

      - name: Warn mode — unresolvable baseline warns and does not fail
        id: test-warn
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./
        with:
          baseline-commit: '0000000000000000000000000000000000000000'

      - name: Strict mode — unresolvable baseline fails
        id: test-strict
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./
        with:
          baseline-commit: '0000000000000000000000000000000000000000'
          fail-on-findings: 'true'

      - name: Assert warn mode passed and strict mode failed
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ "${{ steps.test-warn.outcome }}" != "success" ]; then
            echo "Expected the default (warn) mode to pass on a check that could not run, got ${{ steps.test-warn.outcome }}"
            exit 1
          fi
          if [ "${{ steps.test-strict.outcome }}" != "failure" ]; then
            echo "Expected strict mode to fail on a check that could not run, got ${{ steps.test-strict.outcome }}"
            exit 1
          fi
          echo "Warn mode warns; strict mode fails."

      - name: Run local action
        uses: ./
