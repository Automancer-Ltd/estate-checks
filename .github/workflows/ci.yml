name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install check tools
        run: |
          set -euo pipefail
          uv sync --locked
          uv tool install semgrep==1.178.0
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location --max-time 30 \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        timeout-minutes: 3
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          # Bounded per attempt, digest-pinned and retried, so a stalled or truncated transfer
          # retries here instead of reddening Check (19 Oct 2026, gdp-maia run 39339817582
          # stalled at 3.7 MB of 8.2 MB, and the scan then read a truncated archive).
          scripts/fetch-gitleaks.sh "$GITLEAKS_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan commit for secrets
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=HEAD
      - name: Lint, typecheck and script tests
        run: scripts/check scripts/test-validation.py scripts/test-workflow-standards.py scripts/test-install-timeouts.py tier/test_classify.py

      - name: Bounded Semgrep install test
        run: scripts/test-install-semgrep.sh

      # An invalid rule file passes `semgrep --test` (exit 0) but fails every scan the
      # next step drives (exit 7), so a separate `semgrep --validate` (~5 s) adds nothing.
      - name: Semgrep rule fixtures
        run: semgrep --test --legacy rules/

      - name: Verify real action journeys
        run: uv tool run --python 3.12 --from semgrep==1.178.0 --with PyYAML python scripts/verify-estate-checks.py --evidence .audit/ci-proof

      - name: Retain action proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: action-proof
          path: .audit/ci-proof
          include-hidden-files: true
          retention-days: 14

      - name: Run local action
        uses: ./
