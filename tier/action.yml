name: 'Estate CI tier'
description: 'Choose how much CI a change needs (none, core, standard) so CI effort matches what was touched'
inputs:
  sparse-checkout:
    description: 'Optional. Newline-separated checkout patterns. Retain all code, tests, docs and configuration the classifier reads. Empty means a full checkout.'
    required: false
    default: ''
  sparse-checkout-cone-mode:
    description: 'Use cone mode for sparse checkout. Set false for gitignore-style patterns.'
    required: false
    default: 'true'
  docs-paths:
    description: 'Optional. Globs that count as documentation, replacing the built-in default (all .md and .rst outside product/content/test folders). "none" means nothing is documentation, for repos where markdown is the product.'
    required: false
    default: ''
  docs-exclude:
    description: 'Optional. Extra globs that are never documentation, added to the built-in list.'
    required: false
    default: ''
  full-paths:
    description: 'Optional. Extra globs that always need the full suite, added to the built-in list (lockfiles, CI, toolchain config, schema, migrations, deploy config).'
    required: false
    default: ''
  small-max-files:
    description: 'A change of at most this many non-doc files (and small-max-lines) runs the core tier.'
    required: false
    default: '3'
  small-max-lines:
    description: 'A change of at most this many changed non-doc lines (and small-max-files) runs the core tier.'
    required: false
    default: '50'
  core-max-tests:
    description: 'A small change whose code is named by more than this many test files runs the full suite instead of the quick job.'
    required: false
    default: '30'
  test-globs:
    description: 'Optional. Globs that identify test files, replacing the default (*.test.*, *.spec.*, *_test.*, test_*.py, __tests__/).'
    required: false
    default: ''
  job-name:
    description: "The display name of the job calling this action. On a push to the default branch it is how the action finds what the merged PR's run tested."
    required: false
    default: 'ci tier'
  token:
    description: 'Token with contents, pull-requests, actions and checks read access.'
    required: false
    default: ${{ github.token }}
outputs:
  tier:
    description: 'none | core | standard'
    value: ${{ steps.scan.outputs.tier || steps.plan.outputs.tier || 'standard' }}
  reason:
    description: 'Why that tier was chosen'
    value: ${{ steps.scan.outputs.reason || steps.plan.outputs.reason }}
  changed-files:
    description: 'JSON array of changed paths that still exist (empty when the tier needs no file list, e.g. an already-tested push)'
    value: ${{ steps.scan.outputs.changed-files || steps.plan.outputs.changed-files || '[]' }}
  direct-tests:
    description: 'Core tier only: JSON array of the test files that name the changed code (folder/name), plus changed test files. Run these in the quick job.'
    value: ${{ steps.scan.outputs.direct-tests || steps.plan.outputs.direct-tests || '[]' }}

runs:
  using: 'composite'
  steps:
    - name: Classify the change
      id: plan
      shell: bash
      env:
        INPUT_PHASE: plan
        INPUT_DOCS_PATHS: ${{ inputs.docs-paths }}
        INPUT_DOCS_EXCLUDE: ${{ inputs.docs-exclude }}
        INPUT_FULL_PATHS: ${{ inputs.full-paths }}
        INPUT_SMALL_MAX_FILES: ${{ inputs.small-max-files }}
        INPUT_SMALL_MAX_LINES: ${{ inputs.small-max-lines }}
        INPUT_CORE_MAX_TESTS: ${{ inputs.core-max-tests }}
        INPUT_TEST_GLOBS: ${{ inputs.test-globs }}
        INPUT_JOB_NAME: ${{ inputs.job-name }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/classify.py"

    # A small change, or docs: does code read the changed docs, and which tests
    # name the changed code? A failed checkout makes the scan fail: standard.
    - name: Check out the code to finish classifying
      if: steps.plan.outputs.needs-scan == 'true'
      continue-on-error: true
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}

    - name: Finish classifying
      id: scan
      if: steps.plan.outputs.needs-scan == 'true'
      shell: bash
      env:
        INPUT_PHASE: scan
        INPUT_DOCS_PATHS: ${{ inputs.docs-paths }}
        INPUT_DOCS_EXCLUDE: ${{ inputs.docs-exclude }}
        INPUT_FULL_PATHS: ${{ inputs.full-paths }}
        INPUT_SMALL_MAX_FILES: ${{ inputs.small-max-files }}
        INPUT_SMALL_MAX_LINES: ${{ inputs.small-max-lines }}
        INPUT_CORE_MAX_TESTS: ${{ inputs.core-max-tests }}
        INPUT_TEST_GLOBS: ${{ inputs.test-globs }}
      run: python3 "$GITHUB_ACTION_PATH/classify.py"
